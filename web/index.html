<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exam Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1220; --paper: #F7F5EF; --gold: #E8B923; --gold-soft:#f2c94c;
    --teal: #1F6F5C; --teal-soft:#4FBF9F; --slate: #5C6B7A; --coral:#D64545; --coral-soft:#F3A5A5;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--paper); font-family:'Inter',system-ui,sans-serif; }
  .font-serif { font-family:'Zilla Slab',serif; }
  .font-mono { font-family:'IBM Plex Mono',monospace; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  .configbar { position: sticky; top:0; z-index: 20; background: rgba(11,18,32,.95); border-bottom: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(6px); }
  .configbar .row { display:flex; flex-wrap:wrap; gap:8px; padding: 10px 0; align-items:center; }
  input[type=text] { background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15); border-radius:6px; padding:6px 8px; color:var(--paper); font-size:12px; }
  input[type=text]::placeholder { color:#64748b; }
  #searchTerm, #examName { width: 150px; }
  #proxyUrl { flex:1; min-width:220px; }
  button.primary { display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--gold); color:var(--ink); border:none; border-radius:6px; padding:7px 10px; cursor:pointer; }
  button.primary:hover { background: var(--gold-soft); }
  .badge { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:5px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.15); color:#94a3b8; background: rgba(255,255,255,.05); }
  .badge.live { color: var(--teal-soft); border-color: rgba(31,111,92,.5); background: rgba(31,111,92,.2); }
  .badge.error { color: var(--coral-soft); border-color: rgba(214,69,69,.5); background: rgba(214,69,69,.15); }

  .hero { padding: 32px 0 20px; }
  .ticket { background: var(--paper); color: var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); display:grid; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .ticket { grid-template-columns: 1fr auto; } }
  .ticket-main { padding: 28px; }
  .eyebrow { display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.2em; color:var(--slate); margin-bottom:10px; }
  h1 { font-family:'Zilla Slab',serif; font-size: 34px; margin: 0 0 8px; }
  h1 span { color: var(--teal); }
  .sub { font-size: 13.5px; color:#3A4552; max-width: 420px; margin: 0 0 18px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; }
  .stat { font-family:'IBM Plex Mono',monospace; font-size:11px; background: rgba(11,18,32,.05); border:1px solid rgba(11,18,32,.1); border-radius:6px; padding:4px 8px; }
  .stat b { color: var(--teal); }
  .ticket-side { display:none; border-left: 2px dashed rgba(11,18,32,.15); padding: 24px; text-align:center; }
  @media (min-width: 640px) { .ticket-side { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; } }
  .roll { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--slate); line-height:1.5; }
  .roll b { display:block; font-size:13px; color:var(--ink); }
  .getkit { display:flex; align-items:center; gap:6px; background: var(--ink); color: var(--paper); font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; border:none; border-radius:6px; padding:8px 12px; cursor:pointer; }

  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin: 18px 0; }
  .tab { display:flex; align-items:center; gap:6px; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.15); color:#cbd5e1; background:transparent; cursor:pointer; }
  .tab .count { font-family:'IBM Plex Mono',monospace; font-size:10px; opacity:.7; }
  .tab.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight:600; }

  .grid { display:grid; grid-template-columns: 1fr; gap:12px; padding-bottom: 64px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .card { background:#111a2b; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:16px; }
  .card:hover { border-color: rgba(232,185,35,.5); }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .card-title { font-family:'Zilla Slab',serif; font-size:15px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; }
  .pill.free { background: rgba(31,111,92,.3); color: var(--teal-soft); border:1px solid rgba(31,111,92,.5); }
  .pill.paid { background: rgba(214,69,69,.2); color: var(--coral-soft); border:1px solid rgba(214,69,69,.4); }
  .desc { font-size:12.5px; color:#94a3b8; line-height:1.5; margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 10px; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#cbd5e1; background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:4px; padding:2px 6px; }
  .open { width:100%; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; background: var(--gold); color: var(--ink); border:none; border-radius:6px; padding:7px; cursor:pointer; }
  .open:hover { background: var(--gold-soft); }

  .empty { text-align:center; padding: 60px 0; border:1px dashed rgba(255,255,255,.15); border-radius:10px; color:#64748b; font-size:13px; }
</style>
</head>
<body>
  <div class="configbar">
    <div class="wrap row">
      <input type="text" id="examName" value="SSC CGL" placeholder="Exam name" />
      <input type="text" id="searchTerm" value="ssc cgl" placeholder="search term" />
      <input type="text" id="proxyUrl" placeholder="Backend proxy base URL (e.g. http://localhost:8787) — leave empty for demo data" style="flex:1;" />
      <button class="primary" id="fetchBtn">↻ Fetch</button>
      <span class="badge" id="modeBadge">Demo data</span>
    </div>
  </div>

  <div class="wrap hero">
    <div class="ticket">
      <div class="ticket-main">
        <div class="eyebrow">🎫 Exam Kit — Admit to Practice</div>
        <h1 id="heroTitle">SSC CGL <span>Exam Kit</span></h1>
        <p class="sub" id="heroSub">Every free test, previous paper, quiz, and live series — pulled into one kit.</p>
        <div class="stats" id="heroStats"></div>
      </div>
      <div class="ticket-side">
        <div class="roll">ROLL&nbsp;TERM<b id="rollTerm">SSC CGL</b></div>
        <button class="getkit" id="getKitBtn">⬇ Get Kit</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </div>

<script>
const CATEGORY_META = {
  freeTests:  { label: "Free Tests", tag: "Free" },
  pyp:        { label: "Previous Year Papers", tag: "PYP" },
  quizzes:    { label: "Quizzes", tag: "Quiz" },
  tests:      { label: "Live Tests", tag: "Live" },
  testSeries: { label: "Test Series", tag: "Series" },
  courses:    { label: "Courses", tag: "Course" },
  videos:     { label: "Video Lectures", tag: "Video" },
  articles:   { label: "Articles", tag: "Read" },
};
const TAB_ORDER = Object.keys(CATEGORY_META);

function makeMockData(examName, term) {
  const base = (n, extra = {}) => ({
    id: `${term}-${n}`,
    title: `${examName} ${extra.kind || "Paper"} ${n}`,
    description: extra.desc || `Full-length ${examName} practice paper covering all sections.`,
    isFree: extra.isFree ?? (n % 3 === 0),
    duration: extra.duration ?? 60 + (n % 3) * 15,
    questionCount: extra.questionCount ?? 80 + (n % 4) * 20,
    totalMark: extra.totalMark ?? 100 + (n % 4) * 25,
    totalAttempts: extra.totalAttempts ?? 4200 + n * 733,
  });
  return {
    freeTests: [1,2,3,4].map(n => base(n, { kind: "Free Mock", isFree: true })),
    pyp: [2025,2024,2023,2022].map((y,i) => base(i+1, { kind: `${y} Paper`, isFree: i<2, desc:`Official ${examName} question paper, ${y} session.` })),
    quizzes: [1,2,3,4,5,6].map(n => base(n, { kind:"Topic Quiz", isFree: n%2===0, questionCount:15+n, totalMark:15+n, duration:10+n })),
    tests: [1,2,3].map(n => base(n, { kind:"Live Test", isFree:false, desc:"Scheduled full-syllabus live test with All-India ranking." })),
    testSeries: [1,2].map(n => ({ id:`series-${n}`, title:`${examName} Complete Test Series ${n}`, description:"Structured series covering prelims and mains with sectional cutoffs.", totalAttempts: 18000+n*4200, paidPlusFree: 45+n*10 })),
    courses: [1,2].map(n => ({ id:`course-${n}`, title:`${examName} Foundation to Advanced Batch ${n}`, description:`Live + recorded classes, notes, and doubt sessions.`, isFree:false })),
    videos: [1,2,3,4].map(n => ({ id:`video-${n}`, title:`${examName} Concept Class ${n}`, duration: 1800+n*300, viewCount: 12000+n*3100 })),
    articles: [1,2,3].map(n => ({ id:`article-${n}`, title:`${examName} Syllabus & Strategy — Part ${n}`, description:`A breakdown of what to prioritize this week.` })),
  };
}

function formatDuration(mins) {
  if (mins == null) return null;
  if (mins > 300) mins = Math.round(mins / 60);
  const h = Math.floor(mins/60), m = mins % 60;
  return h ? `${h}h ${m}m` : `${m}m`;
}
function fmtNum(n) { return n?.toLocaleString?.() ?? n; }

let state = { data: {}, activeTab: "freeTests", mode: "mock" };

function render() {
  const examName = document.getElementById("examName").value || "Exam";
  const term = document.getElementById("searchTerm").value || "";

  document.getElementById("heroTitle").innerHTML = `${examName} <span>Exam Kit</span>`;
  document.getElementById("heroSub").textContent = `Every free test, previous paper, quiz, and live series for ${examName} — pulled into one kit.`;
  document.getElementById("rollTerm").textContent = term.toUpperCase();

  const badge = document.getElementById("modeBadge");
  badge.className = "badge " + (state.mode === "live" ? "live" : state.mode === "error" ? "error" : "");
  badge.textContent = state.mode === "live" ? "● Live proxy" : state.mode === "error" ? "⚠ Proxy failed — demo data" : "○ Demo data";

  const statsEl = document.getElementById("heroStats");
  statsEl.innerHTML = TAB_ORDER.filter(k => (state.data[k]||[]).length).slice(0,4)
    .map(k => `<div class="stat"><b>${(state.data[k]||[]).length}</b> ${CATEGORY_META[k].label}</div>`).join("");

  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = TAB_ORDER.map(k => `
    <button class="tab ${state.activeTab === k ? "active" : ""}" data-tab="${k}">
      ${CATEGORY_META[k].label} <span class="count">${(state.data[k]||[]).length}</span>
    </button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    state.activeTab = btn.dataset.tab; render();
  }));

  const items = state.data[state.activeTab] || [];
  const content = document.getElementById("content");
  if (items.length === 0) {
    content.innerHTML = `<div class="empty">Nothing here yet for "${term}" — try a different term or fetch again.</div>`;
    return;
  }
  content.innerHTML = `<div class="grid">${items.map(cardHtml).join("")}</div>`;
}

function cardHtml(item) {
  const chips = [];
  if (item.duration != null) chips.push(`<span class="chip">${formatDuration(item.duration)}</span>`);
  if (item.questionCount != null) chips.push(`<span class="chip">${item.questionCount} Qs</span>`);
  if (item.totalMark != null) chips.push(`<span class="chip">${item.totalMark} marks</span>`);
  if (item.totalAttempts != null) chips.push(`<span class="chip">${fmtNum(item.totalAttempts)} attempts</span>`);
  if (item.viewCount != null) chips.push(`<span class="chip">${fmtNum(item.viewCount)} views</span>`);
  const pill = item.isFree === undefined ? "" :
    `<span class="pill ${item.isFree ? "free" : "paid"}">${item.isFree ? "Free" : "Paid"}</span>`;
  return `
    <div class="card">
      <div class="card-top">
        <h3 class="card-title">${item.title}</h3>
        ${pill}
      </div>
      ${item.description ? `<p class="desc">${item.description}</p>` : ""}
      <div class="chips">${chips.join("")}</div>
      <button class="open">Open →</button>
    </div>`;
}

async function fetchData() {
  const examName = document.getElementById("examName").value || "Exam";
  const term = document.getElementById("searchTerm").value || "";
  const proxyUrl = document.getElementById("proxyUrl").value.trim();

  if (!proxyUrl) {
    state.data = makeMockData(examName, term);
    state.mode = "mock";
    render();
    return;
  }
  try {
    const url = `${proxyUrl.replace(/\/$/, "")}/search/global?term=${encodeURIComponent(term)}`;
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`Proxy responded ${res.status}`);
    const json = await res.json();
    const results = json?.results || json?.data?.results;
    if (!results) throw new Error("Unexpected response shape");
    state.data = results;
    state.mode = "live";
  } catch (err) {
    console.error("Falling back to mock data:", err);
    state.data = makeMockData(examName, term);
    state.mode = "error";
  }
  render();
}

document.getElementById("fetchBtn").addEventListener("click", fetchData);
document.getElementById("getKitBtn").addEventListener("click", fetchData);
fetchData();
</script>
</body>
</html>
