<div id="tb-exam-embed">&nbsp;</div>
<script>
(function(){
  if (window.__tbExamEmbed) return;      // guard against double-run
  window.__tbExamEmbed = true;

  /* ---- CONFIG -----------------------------------------------------------
     PROXY_BASE must point at YOUR deployed server/index.js (see /server in
     this repo), e.g. "https://ssc-proxy-xxxx.onrender.com". The browser
     never holds an auth token — the proxy attaches it server-side. Set it
     via window.__tbProxyBase before this script runs, or edit the default
     below once you have a real deployment.
  ------------------------------------------------------------------------- */
  var PROXY_BASE = window.__tbProxyBase || "";

  /* ---- YOUR EXAMS: label = shown in dropdown/card, term = what the API searches ---- */
  var EXAMS = [
    { label: "SSC CGL",     term: "ssc cgl" },
    { label: "RRB NTPC",    term: "rrb ntpc" },
    { label: "RRB Group D", term: "rrb group d" },
    { label: "IBPS PO",     term: "ibps po" },
    { label: "IBPS Clerk",  term: "ibps clerk" },
    { label: "SBI PO",      term: "sbi po" }
  ];

  /* ---- the isolated document (markup + CSS only, no inner script) ---- */
  var SHELL = [
'<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">',
'<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>',
'  :root{--ink:#12183a;--muted:#5b6684;--line:#e6e9f2;--soft:#f4f6fb;--brand:#2540d6;',
'    --brand-dark:#1a2fa8;--accent:#ff6a3d;--green:#0a8f3c;--bg:#ffffff;--card:#fff;--radius:16px}',
'  *{box-sizing:border-box}',
'  html,body{margin:0;background:var(--bg);color:var(--ink);',
'    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}',
'  .hero{background:radial-gradient(900px 300px at 12% -20%,rgba(37,64,214,.10),transparent 60%),',
'    radial-gradient(700px 300px at 100% 0,rgba(255,106,61,.10),transparent 55%),#fff;',
'    border:1px solid var(--line);border-radius:18px;padding:28px 26px}',
'  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}',
'  .hero h1{font-size:28px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;font-weight:800}',
'  .hero p{margin:0 0 22px;color:var(--muted);font-size:15px;max-width:560px}',
'  .selector{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}',
'  .field{display:flex;flex-direction:column;gap:7px}',
'  .field label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}',
'  .shell{position:relative}',
'  .shell select{appearance:none;-webkit-appearance:none;min-width:300px;font-size:16px;font-weight:600;color:var(--ink);',
'    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 46px 14px 16px;cursor:pointer;transition:.15s}',
'  .shell select:hover{border-color:#c7cee6}',
'  .shell select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,64,214,.12)}',
'  .shell::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;',
'    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}',
'  .count{font-size:13px;color:var(--muted);padding-bottom:14px}.count b{color:var(--ink)}',
'  main{padding:26px 2px 6px}',
'  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}',
'  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;',
'    display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(18,24,58,.06);transition:transform .16s,box-shadow .16s;',
'    opacity:0;transform:translateY(8px);animation:rise .4s ease forwards}',
'  @keyframes rise{to{opacity:1;transform:none}}',
'  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(18,24,58,.10)}',
'  .tw{position:relative;aspect-ratio:16/9;background:var(--soft)}',
'  .tw img{width:100%;height:100%;object-fit:cover;display:block}',
'  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--brand);',
'    font-weight:800;font-size:30px;background:linear-gradient(135deg,#eef1ff,#e6ecff)}',
'  .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;',
'    background:rgba(18,24,58,.82);color:#fff}.badge.live{background:var(--accent)}',
'  .exbadge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;',
'    background:rgba(255,255,255,.92);color:var(--brand);border:1px solid var(--line)}',
'  .cb{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}',
'  .ct{font-weight:700;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}',
'  .cf{color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}',
'  .chip{display:inline-block;font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:3px 9px;border-radius:999px}',
'  .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px}',
'  .price{font-size:15px;font-weight:800}.price .free{color:var(--green);font-size:13px;font-weight:700}',
'  .price .strike{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}',
'  .buy{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;text-decoration:none;',
'    font-weight:700;font-size:13.5px;padding:10px 15px;border-radius:11px;transition:background .15s,transform .1s;white-space:nowrap}',
'  .buy:hover{background:var(--brand-dark)}.buy:active{transform:scale(.97)}.buy svg{width:15px;height:15px}',
'  .state{padding:56px 20px;text-align:center;color:var(--muted)}',
'  .state .big{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}',
'  .sk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}',
'  .sk .skt{aspect-ratio:16/9;background:linear-gradient(90deg,#eef0f6,#f6f7fb,#eef0f6);background-size:200% 100%;animation:sh 1.2s infinite}',
'  .sk .skb{padding:14px 15px 18px}',
'  .skl{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f6,#f6f7fb,#eef0f6);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}',
'  @keyframes sh{to{background-position:-200% 0}}',
'  @media (max-width:640px){.hero h1{font-size:23px}.shell select{min-width:0;width:100%}.field{width:100%}}',
'  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}',
'</style></head><body>',
'  <section class="hero">',
'    <p class="eyebrow">SuperCoaching</p>',
'    <h1>Find your course</h1>',
'    <p>Browse every batch across our exams \u2014 live and recorded \u2014 or pick one exam to narrow it down.</p>',
'    <div class="selector">',
'      <div class="field"><label for="examSelect">Choose your exam</label>',
'        <div class="shell"><select id="examSelect"></select></div>',
'      </div>',
'      <div class="count" id="countPill"></div>',
'    </div>',
'  </section>',
'  <main><div id="results"></div></main>',
'</body></html>'
  ].join('\n');

  /* ---- build the sealed iframe ---- */
  var host = document.getElementById('tb-exam-embed');
  var iframe = document.createElement('iframe');
  iframe.title = 'Explore courses by exam';
  iframe.setAttribute('scrolling','no');
  iframe.style.cssText = 'width:100%;border:0;display:block;margin:24px 0;min-height:420px';
  host.appendChild(iframe);

  var doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open(); doc.write(SHELL); doc.close();

  var sel     = doc.getElementById('examSelect');
  var results = doc.getElementById('results');
  var countPill = doc.getElementById('countPill');
  var cache = {};
  var ALL = '__all__';

  if (!PROXY_BASE) {
    results.innerHTML = '<div class="state"><div class="big">Widget not configured</div>' +
      '<div>Set <code>window.__tbProxyBase</code> to your deployed proxy URL before this script runs.</div></div>';
  }

  // dropdown: "All Exams" first (default), then each exam
  var optAll = doc.createElement('option');
  optAll.value = ALL; optAll.textContent = 'All Exams';
  sel.appendChild(optAll);
  EXAMS.forEach(function(x){
    var o = doc.createElement('option');
    o.value = x.term; o.textContent = x.label;
    sel.appendChild(o);
  });

  /* ---- auto-resize: same-origin, measure directly ---- */
  function fit(){
    var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
    iframe.style.height = h + 'px';
  }
  if (window.ResizeObserver){ try { new ResizeObserver(fit).observe(doc.body); } catch(e){} }
  iframe.contentWindow.addEventListener('resize', fit);
  window.addEventListener('resize', fit);

  sel.addEventListener('change', function(){
    var val = sel.value;
    if (val === ALL) return loadAll();
    var label = sel.options[sel.selectedIndex].text;
    if (cache[val]) return render(cache[val], label, false);
    loadExam(val, label);
  });

  // Calls YOUR proxy (server/index.js), never testbook.com directly.
  // The proxy attaches the real auth token server-side.
  function api(term){
    var u = new URL(PROXY_BASE.replace(/\/$/, '') + '/search/global');
    u.searchParams.set('term', term);
    u.searchParams.set('searchOn', 'courses');
    return u;
  }

  function fetchExam(x){
    // resolves to array of courses (each tagged with its exam label); never rejects
    if (cache[x.term]) return Promise.resolve(cache[x.term]);
    if (!PROXY_BASE) return Promise.resolve([]);
    return fetch(api(x.term), { headers:{ accept:'application/json' }})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        var list = (d && d.results && d.results.courses)
                || (d && d.data && d.data.results && d.data.results.courses)
                || [];
        list.forEach(function(c){ c.__exam = x.label; });
        cache[x.term] = list; return list;
      })
      .catch(function(){ return []; });
  }

  function loadExam(term, label){
    if (!PROXY_BASE) return;
    skeleton(); countPill.textContent=''; fit();
    var x = { term: term, label: label };
    fetchExam(x).then(function(list){
      if (!list.length && !cache[term]) {
        results.innerHTML = '<div class="state"><div class="big">Couldn\u2019t load courses</div>'+
          '<div>Please refresh, or try another exam. If this keeps happening the proxy or upstream token may need attention.</div></div>';
        fit(); return;
      }
      render(list, label, false);
    });
  }

  function loadAll(){
    if (!PROXY_BASE) return;
    skeleton(); countPill.textContent=''; fit();
    Promise.all(EXAMS.map(fetchExam)).then(function(groups){
      var seen = {}, merged = [];
      groups.forEach(function(list){
        list.forEach(function(c){
          var id = c._id || (c.title+'|'+c.__exam);
          if (seen[id]) return;         // de-dupe courses shared across exams
          seen[id] = 1; merged.push(c);
        });
      });
      render(merged, 'All Exams', true);
    });
  }

  /* ---- helpers ---- */
  function urlFor(c){
    var cp = c.classProperties || {};
    var s = cp.slug;
    if (s && typeof s === 'object' && s.prefix && s.suffix) {
      var suf = s.suffix;
      if (suf.indexOf('online-coaching-') !== 0) suf = 'online-coaching-' + suf;
      return 'https://testbook.com/' + s.prefix + '/' + suf;
    }
    if (cp.deeplink) return cp.deeplink;
    return '#';
  }
  function imgFor(c){ var u=c.courseLogo; if(!u) return null; return u.indexOf('//')===0?'https:'+u:u; }
  function esc(s){ var e=doc.createElement('div'); e.textContent=s==null?'':String(s); return e.innerHTML; }
  function priceHtml(c){
    var vals=[c.cost,c.minCost,c.minPrice].filter(function(n){return typeof n==='number'&&n>0;});
    if(!vals.length) return '<span class="free">Included with membership</span>';
    var now=Math.min.apply(null,vals);
    var strike=(typeof c.oldCost==='number'&&c.oldCost>now)?'<span class="strike">\u20B9'+c.oldCost+'</span>':'';
    return '\u20B9'+now+strike;
  }
  var CART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>';

  function skeleton(){
    var s=''; for(var i=0;i<6;i++){
      s+='<div class="sk"><div class="skt"></div><div class="skb"><div class="skl" style="width:80%"></div>'+
         '<div class="skl" style="width:55%"></div><div class="skl" style="width:40%;margin-top:18px"></div></div></div>';
    }
    results.innerHTML='<div class="grid">'+s+'</div>';
  }

  function render(list, label, showExam){
    if(!list.length){
      results.innerHTML='<div class="state"><div class="big">No courses found for '+esc(label)+'</div><div>Try another exam from the dropdown.</div></div>';
      countPill.textContent=''; fit(); return;
    }
    countPill.innerHTML = showExam
      ? '<b>'+list.length+'</b> courses across '+EXAMS.length+' exams'
      : '<b>'+list.length+'</b> course'+(list.length>1?'s':'')+' for '+esc(label);

    var cards=list.map(function(c,i){
      var cp=c.classProperties||{};
      var title=c.title||c.name||'Untitled course';
      var img=imgFor(c);
      var mode=(cp.classType&&cp.classType.type)||'';
      var isLive=/live/i.test(mode);
      var insts=(cp.instructors||[]).slice(0,3).map(function(x){return x.name;}).join(', ');
      var dur=(cp.contentDuration)?cp.contentDuration+'+ hrs':'';
      var init=(String(title).trim().charAt(0)||'\u2022').toUpperCase();
      var thumb=img?'<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.parentNode.innerHTML=&quot;<div class=\\&quot;ph\\&quot;>'+esc(init)+'</div>&quot;">'
                   :'<div class="ph">'+esc(init)+'</div>';
      var badge=mode?'<span class="badge'+(isLive?' live':'')+'">'+esc(mode)+'</span>':'';
      var exbadge=(showExam&&c.__exam)?'<span class="exbadge">'+esc(c.__exam)+'</span>':'';
      return '<article class="card" style="animation-delay:'+(Math.min(i,20)*35)+'ms">'+
        '<div class="tw">'+thumb+badge+exbadge+'</div><div class="cb">'+
          '<h3 class="ct">'+esc(title)+'</h3>'+
          (insts?'<div class="cf">'+esc(insts)+'</div>':'')+
          (dur?'<div><span class="chip">'+esc(dur)+'</span></div>':'')+
          '<div class="foot"><div class="price">'+priceHtml(c)+'</div>'+
          '<a class="buy" href="'+esc(urlFor(c))+'" target="_blank" rel="noopener">'+CART+'Buy Now</a></div>'+
        '</div></article>';
    }).join('');
    results.innerHTML='<div class="grid">'+cards+'</div>';
    fit(); setTimeout(fit,120); setTimeout(fit,500);
  }

  /* ---- default view on open: ALL exams ---- */
  sel.value = ALL;
  loadAll();
})();
</script>
